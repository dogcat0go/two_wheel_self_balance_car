<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,monospace" font-size="12.5">
      <defs>
        <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4A5B68"/></marker>
        <marker id="arA" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#C96A10"/></marker>
      </defs>
      <!-- 估计器块 -->
      <rect x="20" y="150" width="120" height="70" rx="7" fill="#EDF3F6" stroke="#2B6E8F" stroke-width="1.6"/>
      <text x="80" y="178" text-anchor="middle" fill="#2B6E8F" font-weight="700">姿态/里程计</text>
      <text x="80" y="196" text-anchor="middle" fill="#2B6E8F">→ x̂=[θ̂,θ̇,ŝ,v̂]</text>
      <!-- 斜坡 KF -->
      <rect x="20" y="255" width="120" height="60" rx="7" fill="#FDFAF5" stroke="#C96A10" stroke-width="1.6"/>
      <text x="80" y="280" text-anchor="middle" fill="#C96A10" font-weight="700">斜坡 KF</text>
      <text x="80" y="298" text-anchor="middle" fill="#C96A10">→ α̂</text>
      <!-- x_ref 生成 -->
      <rect x="200" y="255" width="150" height="60" rx="7" fill="#FFFFFF" stroke="#C96A10" stroke-width="1.4"/>
      <text x="275" y="278" text-anchor="middle" fill="#C96A10" font-weight="700">参考生成</text>
      <text x="275" y="296" text-anchor="middle" fill="#1C2B36">x_ref=[θ_eq(α̂),0,s*,0]</text>
      <!-- 求和点 -->
      <circle cx="270" cy="185" r="18" fill="#FFFFFF" stroke="#1C2B36" stroke-width="1.6"/>
      <text x="270" y="190" text-anchor="middle" fill="#1C2B36" font-size="15">−</text>
      <text x="248" y="168" fill="#1C2B36" font-size="14">e</text>
      <!-- LQR -->
      <rect x="360" y="158" width="90" height="54" rx="7" fill="#FFFFFF" stroke="#1C2B36" stroke-width="1.6"/>
      <text x="405" y="182" text-anchor="middle" fill="#1C2B36" font-weight="700">−K·e</text>
      <text x="405" y="200" text-anchor="middle" fill="#4A5B68" font-size="11">(增益不变)</text>
      <!-- 前馈块 -->
      <rect x="360" y="255" width="150" height="60" rx="7" fill="#FDFAF5" stroke="#C96A10" stroke-width="1.4"/>
      <text x="435" y="278" text-anchor="middle" fill="#C96A10" font-weight="700">前馈 τ_ff</text>
      <text x="435" y="296" text-anchor="middle" fill="#1C2B36">= Mgr·sin α̂</text>
      <!-- 力矩求和 -->
      <circle cx="530" cy="185" r="18" fill="#FFFFFF" stroke="#1C2B36" stroke-width="1.6"/>
      <text x="530" y="190" text-anchor="middle" fill="#1C2B36" font-size="15">+</text>
      <!-- 电机/车 -->
      <rect x="600" y="155" width="130" height="60" rx="7" fill="#EDF3F6" stroke="#3D7A4A" stroke-width="1.6"/>
      <text x="665" y="180" text-anchor="middle" fill="#3D7A4A" font-weight="700">电机 + 车</text>
      <text x="665" y="198" text-anchor="middle" fill="#3D7A4A">(被控对象)</text>
      <!-- 连线 -->
      <line x1="140" y1="185" x2="252" y2="185" stroke="#4A5B68" stroke-width="1.6" marker-end="url(#ar)"/>
      <text x="165" y="178" fill="#2B6E8F">x̂</text>
      <line x1="275" y1="255" x2="272" y2="203" stroke="#C96A10" stroke-width="1.6" marker-end="url(#arA)"/>
      <line x1="140" y1="285" x2="200" y2="285" stroke="#C96A10" stroke-width="1.6" marker-end="url(#arA)"/>
      <line x1="288" y1="185" x2="360" y2="185" stroke="#4A5B68" stroke-width="1.6" marker-end="url(#ar)"/>
      <line x1="450" y1="185" x2="512" y2="185" stroke="#4A5B68" stroke-width="1.6" marker-end="url(#ar)"/>
      <text x="465" y="178" fill="#1C2B36">τ_fb</text>
      <line x1="435" y1="255" x2="530" y2="203" stroke="#C96A10" stroke-width="1.6" marker-end="url(#arA)"/>
      <line x1="80" y1="255" x2="80" y2="220" stroke="#C96A10" stroke-width="1.4" stroke-dasharray="0"/>
      <line x1="548" y1="185" x2="600" y2="185" stroke="#4A5B68" stroke-width="2" marker-end="url(#ar)"/>
      <text x="558" y="178" fill="#1C2B36" font-weight="700">τ</text>
      <!-- 反馈回估计器 -->
      <line x1="665" y1="215" x2="665" y2="345" stroke="#4A5B68" stroke-width="1.4"/>
      <line x1="665" y1="345" x2="80" y2="345" stroke="#4A5B68" stroke-width="1.4"/>
      <line x1="80" y1="345" x2="80" y2="315" stroke="#4A5B68" stroke-width="1.4" marker-end="url(#ar)"/>
      <text x="350" y="360" text-anchor="middle" fill="#4A5B68" font-size="11.5">传感器读数 + 上一拍实际 τ（喂回估计器，延迟一拍，见 §7）</text>
      <!-- 顶部分区标注 -->
      <text x="405" y="140" text-anchor="middle" fill="#4A5B68" font-size="11">快回路：平衡（K 反馈，高带宽）</text>
      <text x="435" y="335" text-anchor="middle" fill="#C96A10" font-size="11">慢回路：斜坡补偿（低带宽）</text>
    </svg>
