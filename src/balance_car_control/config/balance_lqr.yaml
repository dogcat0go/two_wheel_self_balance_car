balance_controller_node:
  ros__parameters:
    control_mode: lqr
    use_sim_time: true
    enabled: false

    imu_topic: /imu/data
    joint_states_topic: /joint_states
    command_topic: /wheel_effort_controller/commands
    debug_topic: /balance_controller/debug
    control_rate: 200.0
    log_period_sec: 0.5

    max_wheel_effort: 0.12
    max_effort_slew: 80.0
    fall_angle_rad: 0.5
    imu_timeout_sec: 1.0
    recovery_ramp_sec: 1.0
    wheel_velocity_lpf_alpha: 0.5

    # ---- LQR 增益：启动时按 balance_lqr_tuning.yaml 自动重算 K 并写回本 yaml ----
    lqr_auto_compute_gains: true
    lqr_write_gains_to_yaml: true
    lqr_tuning_yaml: ""
    k_theta: -0.89239459
    k_theta_dot: -0.08124025
    k_x: -0.24027916
    k_x_dot: -0.30990905
    lqr_output_sign: 1.0
    # 实测站立平衡倾角约 -0.011 rad，对齐 PID 的 pitch_target 偏置
    lqr_pitch_bias: -0.011
    lqr_reference_enabled: true

    # ---- 运动指令 ----
    cmd_vel_topic: /cmd_vel
    motion_control_enabled: true
    wheel_radius: 0.0325
    max_linear_velocity: 0.5
    max_angular_velocity: 1.5
    max_wheel_velocity_cmd: 10.0
    cmd_vel_timeout_sec: 0.5
    target_velocity: 0.0

    # ---- 偏航环 ----
    yaw_loop_enabled: true
    kp_yaw: 0.07
    kd_yaw: 0.0
    max_turn_tau: 0.06
    yaw_output_sign: 1.0
    yaw_cmd_activate_threshold: 0.05
    yaw_rate_deadband: 0.02
